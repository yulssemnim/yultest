<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 스캔 데모</title>
    <!-- 올바른 CDN -->
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }

        #reader {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <h1>QR 코드 스캔 데모</h1>
    <p>QR을 카메라로 비추면 자동으로 이동합니다.</p>
    <div id="reader"></div>

    <script>
        function onScanSuccess(decodedText) {
            console.log("스캔 성공:", decodedText);
            if (decodedText.startsWith("http")) {
                window.location.href = decodedText;
            } else {
                window.location.href = "/detail/" + decodedText + ".html";
            }
        }

        function onScanError(errorMessage) {
            console.warn("스캔 에러:", errorMessage);
        }

        // ✅ 이제 정상 작동
        const html5QrCode = new Html5QrcodeScanner("reader", {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        });
        html5QrCode.render(onScanSuccess, onScanError);
    </script>
</body>

</html>
