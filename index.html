<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 스캔 데모</title>
    <!-- html5-qrcode 라이브러리 로드 -->
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }

        #reader {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <h1>QR 코드 스캔 데모</h1>
    <p>QR을 카메라로 비추면 자동으로 이동합니다.</p>
    <div id="reader"></div>

    <script>
        function onScanSuccess(decodedText) {
            console.log("스캔 성공:", decodedText);
            // QR 안에 URL이 포함된 경우
            if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                window.location.href = decodedText;
            } else {
                // 단순 ID인 경우 예시 페이지로 이동
                window.location.href = "/detail/" + decodedText + ".html";
            }
        }

        function onScanError(errorMessage) {
            // 스캔 실패시 (에러 무시 또는 로그 출력)
            console.warn("스캔 에러:", errorMessage);
        }

        // Html5QrcodeScanner 인스턴스 생성
        const html5QrCode = new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            }
        );
        html5QrCode.render(onScanSuccess, onScanError);
    </script>
</body>

</html>
